<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Safety Copilot | 현장 안전 비서</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap');
    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    * { word-break: keep-all; }

    /* 모바일 브라우저 주소창 고려 동적 뷰포트 높이 */
    .app-height {
      height: 100vh;
      height: 100dvh;
    }

    /* 스크롤바 커스텀 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

    @keyframes subtle-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.98); }
    }
    .pulse-live { animation: subtle-pulse 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex justify-center app-height overflow-hidden selection:bg-sky-500 selection:text-white">

  <!-- ============================================== -->
  <!-- 메인 모바일·태블릿 래퍼 (최대 너비 640px 모바일 퍼스트) -->
  <!-- ============================================== -->
  <div class="w-full max-w-2xl bg-white flex flex-col app-height shadow-2xl relative border-x border-slate-200/80">

    <!-- ============================================== -->
    <!-- 1. 상단 미니멀 앱 헤더 (Fixed) -->
    <!-- ============================================== -->
    <header class="bg-slate-900 text-white px-4 py-3 shrink-0 flex items-center justify-between border-b border-slate-800 shadow-sm z-30">
      
      <!-- 좌측: 관제 대시보드 복귀 및 브랜드 -->
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-1.5 -ml-1 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800 transition" title="통합 관제 포털로 이동">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>

        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-sm shadow-sky-500/30">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="flex items-center gap-1.5 leading-none">
              <span class="text-sm font-extrabold tracking-tight">Safety Copilot</span>
              <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-live"></span>
            </div>
            <div class="text-[11px] text-slate-400 font-medium leading-none mt-1">
              (주)케이프라이드 · (주)보담 현장 안전 비서
            </div>
          </div>
        </div>
      </div>

      <!-- 우측: 119 긴급 직통 & 추가 메뉴 -->
      <div class="flex items-center gap-1.5">
        <a href="tel:119" class="bg-rose-600/90 hover:bg-rose-600 text-white text-xs font-black px-2.5 py-1.5 rounded-xl shadow-xs flex items-center gap-1 transition active:scale-95">
          <i data-lucide="phone-call" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">119 긴급</span>
        </a>
        <button onclick="openSettingsModal()" class="p-2 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800 transition" title="설정">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>

    </header>

    <!-- 사업장 선택 필터 바 (미니멀 탭) -->
    <div class="bg-slate-50 border-b border-slate-200/90 px-4 py-2 shrink-0 flex items-center justify-between text-xs">
      <div class="flex items-center gap-1.5">
        <span class="text-[11px] text-slate-400 font-bold shrink-0">사업장:</span>
        <div class="flex bg-slate-200/70 p-0.5 rounded-lg text-[11px] font-semibold text-slate-600">
          <button onclick="setCompanyFilter('all')" id="filter-all" class="px-2.5 py-1 rounded-md bg-white text-slate-900 font-bold shadow-xs transition">
            통합
          </button>
          <button onclick="setCompanyFilter('kpride')" id="filter-kpride" class="px-2.5 py-1 rounded-md hover:text-slate-900 transition">
            케이프라이드
          </button>
          <button onclick="setCompanyFilter('bodam')" id="filter-bodam" class="px-2.5 py-1 rounded-md hover:text-slate-900 transition">
            보담
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="clearChat()" class="text-[11px] text-slate-400 hover:text-slate-700 flex items-center gap-1 transition">
          <i data-lucide="rotate-ccw" class="w-3 h-3"></i> 대화 초기화
        </button>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- 2. 스크롤 가능한 대화 메시지 영역 (Flex-1) -->
    <!-- ============================================== -->
    <main id="chatMessages" class="flex-1 p-4 overflow-y-auto custom-scroll space-y-4 bg-slate-50/70 text-xs sm:text-sm">
      
      <!-- 봇 환영 메시지 (첫 안내 인사 및 간결한 가이드 구문) -->
      <div class="flex items-start gap-2.5">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5">
          <i data-lucide="bot" class="w-4 h-4"></i>
        </div>
        <div class="max-w-[85%] bg-white p-3.5 rounded-2xl rounded-tl-none border border-slate-200/90 shadow-xs text-slate-800 space-y-1.5 text-xs sm:text-sm">
          <div class="font-bold text-slate-900 flex items-center gap-1.5">
            <span>현장 안내 비서가 준비되었습니다.</span>
          </div>
          <p class="text-slate-600 leading-relaxed text-xs">
            사고 발생 시 비상 대응 절차, 설비별 안전 수칙, 작업 전 필수 점검사항, 사내외 비상연락망 등을 자유롭게 질문해 주세요.
          </p>
        </div>
      </div>

    </main>

    <!-- ============================================== -->
    <!-- 3. 모바일 최적화 하단 입력바 (Fixed) -->
    <!-- ============================================== -->
    <footer class="bg-white border-t border-slate-200 shrink-0 z-20 p-3">
      <form id="chatForm" onsubmit="handleSend(event)" class="flex items-center gap-2">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="궁금한 안전 매뉴얼이나 비상 조치를 물어보세요..." 
            class="w-full pl-4 pr-10 py-3 text-xs sm:text-sm bg-slate-100 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition text-slate-800 placeholder-slate-400"
            autocomplete="off"
          >
          <button type="button" onclick="voiceInputDemo()" title="음성 인식" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-sky-600 transition p-1">
            <i data-lucide="mic" class="w-4 h-4"></i>
          </button>
        </div>
        <button 
          type="submit" 
          id="sendBtn" 
          class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sky-600 to-indigo-600 text-white flex items-center justify-center hover:brightness-110 active:scale-95 shadow-md shadow-sky-600/30 transition shrink-0"
        >
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </form>
    </footer>

  </div>

  <!-- ============================================== -->
  <!-- 4. 간결한 설정 모달 (API 키 & 사업장 선택) -->
  <!-- ============================================== -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2 font-bold text-slate-900 text-sm">
          <i data-lucide="settings" class="w-4 h-4 text-sky-600"></i>
          <span>안전 비서 설정</span>
        </div>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs text-slate-600">
        <div class="bg-sky-50 border border-sky-200/80 p-3 rounded-2xl text-[11px] leading-relaxed text-sky-900">
          💡 <strong>내장 지식 검색(RAG)</strong>이 활성화되어 있어 별도 설정 없이도 케이프라이드·보담 사내 SOP 기반으로 정확히 동작합니다.
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Gemini API Key (선택 사항)</label>
          <input 
            type="password" 
            id="apiKeyInput" 
            placeholder="AIzaSy... (선택 시 고성능 AI 모드)" 
            class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 font-mono"
          >
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
        <button onclick="clearApiKey()" class="px-3 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition">
          키 초기화
        </button>
        <button onclick="saveApiKey()" class="px-4 py-2 text-xs font-bold bg-slate-900 text-white rounded-xl hover:bg-slate-800 transition">
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- 지식 베이스 스크립트 로드 -->
  <script src="safetyKnowledge.js"></script>

  <!-- 챗봇 컨트롤 로직 -->
  <script>
    lucide.createIcons();

    let currentFilter = 'all'; // all, kpride, bodam
    let apiKey = localStorage.getItem('gemini_safety_copilot_key') || '';

    // 사업장 필터 변경
    function setCompanyFilter(company) {
      currentFilter = company;
      ['all', 'kpride', 'bodam'].forEach(c => {
        const btn = document.getElementById(`filter-${c}`);
        if (c === company) {
          btn.className = "px-2.5 py-1 rounded-md bg-white text-slate-900 font-bold shadow-xs transition";
        } else {
          btn.className = "px-2.5 py-1 rounded-md hover:text-slate-900 transition";
        }
      });
    }

    // 모달 제어
    function openSettingsModal() {
      document.getElementById('apiKeyInput').value = apiKey;
      document.getElementById('settingsModal').classList.remove('hidden');
    }
    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }
    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      apiKey = val;
      if (val) {
        localStorage.setItem('gemini_safety_copilot_key', val);
        alert('Gemini API 키가 저장되었습니다.');
      } else {
        localStorage.removeItem('gemini_safety_copilot_key');
        alert('API 키가 초기화되었습니다. 내장 RAG 모드로 동작합니다.');
      }
      closeSettingsModal();
    }
    function clearApiKey() {
      apiKey = '';
      localStorage.removeItem('gemini_safety_copilot_key');
      document.getElementById('apiKeyInput').value = '';
      alert('API 키가 삭제되었습니다.');
      closeSettingsModal();
    }

    function clearChat() {
      if (confirm('대화 내용을 초기화하시겠습니까?')) {
        location.reload();
      }
    }

    function voiceInputDemo() {
      alert("음성 인식 안내: 모바일 마이크 음성 입력 기능은 사내 현장 소음 환경에 맞춘 음성 모델과 연동 준비 중입니다.");
    }

    // 퀵 프롬프트 전송
    function askPrompt(text) {
      document.getElementById('messageInput').value = text;
      handleSend(new Event('submit'));
    }

    // 메시지 전송 처리
    async function handleSend(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      appendUserBubble(text);
      input.value = '';

      const loadingId = appendLoading();

      try {
        const responseData = await generateAnswer(text);
        removeLoading(loadingId);
        appendBotBubble(responseData);
      } catch (err) {
        console.error(err);
        removeLoading(loadingId);
        appendErrorBubble("응답 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
      }
    }

    function appendUserBubble(text) {
      const chat = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = "flex justify-end";
      div.innerHTML = `
        <div class="max-w-[85%] bg-sky-600 text-white px-4 py-3 rounded-2xl rounded-tr-none shadow-xs text-xs sm:text-sm font-medium leading-relaxed">
          ${escapeHtml(text)}
        </div>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function appendLoading() {
      const id = 'load-' + Date.now();
      const chat = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.id = id;
      div.className = "flex items-start gap-2.5";
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5">
          <i data-lucide="bot" class="w-4 h-4"></i>
        </div>
        <div class="bg-white px-4 py-3 rounded-2xl rounded-tl-none border border-slate-200 shadow-xs flex items-center gap-1.5">
          <div class="w-2 h-2 rounded-full bg-sky-500 animate-bounce" style="animation-delay: 0ms"></div>
          <div class="w-2 h-2 rounded-full bg-sky-500 animate-bounce" style="animation-delay: 150ms"></div>
          <div class="w-2 h-2 rounded-full bg-sky-500 animate-bounce" style="animation-delay: 300ms"></div>
          <span class="text-xs text-slate-400 font-medium ml-1">사내 매뉴얼 검색 중...</span>
        </div>
      `;
      chat.appendChild(div);
      lucide.createIcons();
      chat.scrollTop = chat.scrollHeight;
      return id;
    }

    function removeLoading(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function appendBotBubble(data) {
      const chat = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = "flex items-start gap-2.5";

      let emergencyHtml = '';
      if (data.isEmergency && data.emergencySOP) {
        emergencyHtml = `
          <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 text-xs text-rose-950 mb-2">
            <div class="font-extrabold flex items-center justify-between text-rose-700 text-xs mb-1">
              <span class="flex items-center gap-1.5">
                <i data-lucide="alert-octagon" class="w-4 h-4 text-rose-600"></i>
                [골든타임 비상 SOP] ${escapeHtml(data.emergencySOP.title)}
              </span>
              <a href="tel:119" class="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md flex items-center gap-1">
                119 통화
              </a>
            </div>
            <p class="text-[11px] text-rose-800 font-semibold leading-relaxed">
              ${escapeHtml(data.emergencySOP.summary)}
            </p>
          </div>
        `;
      }

      let stepsHtml = '';
      if (data.steps && data.steps.length > 0) {
        stepsHtml = `
          <div class="space-y-1.5 text-xs text-slate-700 mt-2">
            <div class="font-bold text-slate-900 flex items-center gap-1">
              <i data-lucide="list-ordered" class="w-3.5 h-3.5 text-sky-600"></i> 현장 대응 단계별 순서:
            </div>
            <div class="space-y-1 pl-1">
              ${data.steps.map(s => `<div class="p-2 rounded-lg bg-slate-50 border border-slate-100 font-medium text-slate-800">${escapeHtml(s)}</div>`).join('')}
            </div>
          </div>
        `;
      }

      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5">
          <i data-lucide="bot" class="w-4 h-4"></i>
        </div>
        <div class="max-w-[88%] bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200/90 shadow-xs text-slate-800 space-y-2">
          ${emergencyHtml}
          <div class="text-xs sm:text-sm text-slate-800 leading-relaxed whitespace-pre-line">
            ${data.text}
          </div>
          ${stepsHtml}
          <div class="text-[10px] text-slate-400 pt-2 border-t border-slate-100 flex items-center justify-between">
            <span>출처: ${escapeHtml(data.source || '사내 안전보건 규정')}</span>
            <span class="text-emerald-600 font-bold flex items-center gap-0.5">
              <i data-lucide="check-circle-2" class="w-3 h-3"></i> SOP 검증됨
            </span>
          </div>
        </div>
      `;

      chat.appendChild(div);
      lucide.createIcons();
      chat.scrollTop = chat.scrollHeight;
    }

    function appendErrorBubble(msg) {
      const chat = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = "flex items-start gap-2.5";
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-rose-600 text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5">
          <i data-lucide="alert-circle" class="w-4 h-4"></i>
        </div>
        <div class="max-w-[85%] bg-rose-50 text-rose-800 p-3 rounded-2xl rounded-tl-none border border-rose-200 text-xs">
          ${escapeHtml(msg)}
        </div>
      `;
      chat.appendChild(div);
      lucide.createIcons();
      chat.scrollTop = chat.scrollHeight;
    }

    // 답변 생성 엔진
    async function generateAnswer(query) {
      const result = searchSafetyKnowledge(query);

      // Gemini API 키가 있는 경우 라이브 호출
      if (apiKey) {
        try {
          const apiAns = await callGeminiAPI(query, result);
          return {
            text: apiAns,
            isEmergency: result.isEmergencyQuery,
            emergencySOP: result.emergency[0] || null,
            steps: result.emergency[0]?.steps || null,
            source: result.emergency[0] ? `(주)케이프라이드 · 보담 [${result.emergency[0].title}]` : "Gemini AI & 사내 안전 규정"
          };
        } catch (e) {
          console.warn("Gemini API 실패, 내장 RAG 엔진 대체", e);
        }
      }

      return makeBuiltInAnswer(query, result);
    }

    function makeBuiltInAnswer(query, result) {
      const q = query.toLowerCase();

      // 1. 긴급 SOP
      if (result.emergency.length > 0) {
        const sop = result.emergency[0];
        let text = `<strong>${sop.title}</strong>에 따른 표준 행동 요령입니다.\n${sop.summary}`;
        if (sop.caution) text += `\n\n⚠️ <strong>주의사항:</strong> ${sop.caution}`;
        if (sop.prevention) text += `\n🛡️ <strong>예방 수칙:</strong> ${sop.prevention}`;

        return {
          text: text,
          isEmergency: true,
          emergencySOP: sop,
          steps: sop.steps,
          source: `(주)케이프라이드 · (주)보담 [${sop.title}]`
        };
      }

      // 2. 안전수칙
      if (result.rules.length > 0) {
        const rule = result.rules[0];
        return {
          text: `<strong>[${rule.title}]</strong>\n\n${rule.content}`,
          isEmergency: false,
          emergencySOP: null,
          steps: null,
          source: `산업안전보건기준 및 사내 지침 (${rule.title})`
        };
      }

      // 3. 비상연락망
      if (q.includes("연락") || q.includes("전화") || q.includes("병원") || q.includes("기관")) {
        let text = "<strong>🚨 사내외 주요 비상 연락망 및 관할 기관:</strong>\n";
        for (const c of SAFETY_KNOWLEDGE_BASE.emergencyContacts) {
          text += `• <strong>${c.role}</strong>: <a href="tel:${c.number}" class="text-sky-600 font-bold underline">${c.number}</a> (${c.desc})\n`;
        }
        return {
          text: text,
          isEmergency: false,
          source: "2025/2026 3사 사내 비상 연락망"
        };
      }

      // 4. 일반 안내
      return {
        text: `질문하신 내용에 대한 사내 규정을 안내합니다.\n\n• <strong>현장 원칙:</strong> 위험 상황 발견 시 즉시 작업을 중지하고 관리감독자에게 보고하십시오.\n• <strong>케이프라이드(횡성):</strong> 육가공 분쇄기, 배합기, 충진기, 포장 라인 LOTO(잠금장치) 준수\n• <strong>보담(원주 LPC):</strong> 골절기(본쏘) 방호가드 필수 및 사내도급(조인테크) 순회점검 준수\n\n구체적인 설비명(분쇄기, 골절기, 지게차, 화학세척제 등)으로 질문하시면 정확한 단계별 SOP를 안내해 드립니다.`,
        isEmergency: false,
        source: "산업안전보건관리체계 총칙"
      };
    }

    async function callGeminiAPI(query, searchResult) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
      const contextPrompt = `
당신은 (주)케이프라이드 및 (주)보담의 전문 '현장 안전 비서 (Safety Copilot)'입니다.
사내 현장 작업자와 관리자의 안전을 최우선으로 하며, 공식 절차(SOP)에 따라 정확하고 명확하게 답변해야 합니다.

[사내 사업장 정보]
- (주)케이프라이드 (강원 횡성): 식료품제조업(소시지, 햄, 패티), 분쇄기, 배합기, 훈연기, 지게차, 암모니아 냉동고
- (주)보담 (강원 원주 LPC): 축산물 도소매/가공, 골절기(본쏘), 육절기, 지게차, 사내도급((주)조인테크)
- 지정병원: 원주세브란스기독병원 권역외상센터, 횡성대성병원

[참조 지식 베이스 검색 결과]
${JSON.stringify(searchResult, null, 2)}

[답변 작성 지침]
1. 사고나 비상 상황일 경우 '비상정지 -> 전원차단 -> 119 신고' 순서의 골든타임 행동 요령을 최우선으로 제시하십시오.
2. 기계 역회전 엄금, 단독 구조 금지 등 2차 사고를 막는 경고를 굵은 글씨로 강조하십시오.
3. 모바일 화면에서 한눈에 들어오도록 간결하고 명확하게 작성하십시오.
`;

      const body = {
        contents: [
          { role: "user", parts: [{ text: `${contextPrompt}\n\n사용자 질문: ${query}` }] }
        ]
      };

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!res.ok) throw new Error(`API Error: ${res.status}`);
      const json = await res.json();
      return json.candidates[0].content.parts[0].text;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
